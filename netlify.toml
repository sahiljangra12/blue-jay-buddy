# Netlify: the static app is copied to dist/ (so node_modules and server code are never published),
# and everything in netlify/functions becomes the server API under /api/*.
[build]
  command = "mkdir -p dist && cp -r index.html styles.css data.js guides.js illustrations.js programs.js food-data.js sw.js manifest.webmanifest js assets dist/"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), geolocation=(self), camera=(self)"
