name: probe feeds
on: push
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set +e
          K=8882812681
          out=probe.txt; : > $out
          p(){ echo "=== $1" >> $out; curl -sS -m 20 -A "Mozilla/5.0" -D - -o body.tmp "$1" 2>&1 | grep -iE "^HTTP|access-control|content-type" >> $out; head -c 1500 body.tmp >> $out 2>/dev/null; echo >> $out; true; }
          B="https://jhu.transloc.com/Services/JSONPRelay.svc"
          echo "=== ARR26" >> $out
          curl -sS -m 20 "$B/GetStopArrivalTimes?apiKey=$K&routeIds=26&version=2" | jq -c '.[] | {RouteStopId,StopDescription,Times:(.Times[:2])}' | head -14 >> $out
          echo "=== ARR33,4,24" >> $out
          curl -sS -m 20 "$B/GetStopArrivalTimes?apiKey=$K&routeIds=33,4,24,43,29&version=2" | jq -c '.[] | {RouteId,StopDescription,n:(.Times|length),t:(.Times[0].Text // .Times[0].Seconds)}' | head -40 >> $out
          echo "=== ROUTE26 info" >> $out
          curl -sS -m 20 "$B/GetRoutesForMapWithScheduleWithEncodedLine?apiKey=$K&isDispatch=false" | jq -c '.[] | select(.RouteID==26) | {IsRunning,InfoText,Stops:[.Stops[]|{RouteStopID,SecondsToNextStop,ShowEstimatesOnMap,ShowDefaultedOnMap}][:3]}' >> $out
          echo "=== CG headers" >> $out
          curl -sS -m 25 -A "Mozilla/5.0" -H "Origin: https://sahiljangra12.github.io" -D - -o cg.ics "https://static-prod-us-east-1.campusgroups.com/ical/jhu/ical_jhu.ics" | grep -iE "^HTTP|access-control|content-type|content-length|cache" >> $out
          ls -la cg.ics >> $out; grep -c BEGIN:VEVENT cg.ics >> $out
          echo "=== CG today+" >> $out
          python3 - >> $out <<'PY'
          import re,datetime
          t=open("cg.ics",encoding="utf-8",errors="ignore").read().replace("\r\n","\n").replace("\n ","")
          ev=t.split("BEGIN:VEVENT")[1:]
          now=datetime.datetime.utcnow().strftime("%Y%m%d")
          fut=[e for e in ev if (m:=re.search(r"^DTSTART[^:]*:(\d{8})",e,re.M)) and m.group(1)>=now]
          print("future events",len(fut))
          for e in fut[:6]:
              print("----"); print("\n".join(l[:160] for l in e.split("\n")[:25]))
          PY
          cat probe.txt
