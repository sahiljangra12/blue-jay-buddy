# Refreshes events.json from the public Hopkins Groups calendar every two hours.
# Only commits when the events actually changed; GitHub Pages then republishes the site.
name: Refresh campus events
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: events
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-events.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- events.json; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          git commit -m "Refresh campus events"
          git push
